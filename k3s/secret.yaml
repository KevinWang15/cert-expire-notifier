apiVersion: v1
kind: Secret
metadata:
  name: cert-expire-notifier-secret
  namespace: cert-expire-notifier
type: Opaque
stringData:
  APP_VERSION: "0.2.0"
  NODE_ENV: "production"
  SITE: "new"
  PUBLIC_APP_URL: "https://cert-expire-notifier.example.com"
  PORT: "3000"
  JWT_SECRET: "replace-with-a-long-random-secret"
  DATABASE_URL: "mysql://cert_expire_notifier:replace-with-a-strong-app-password@cert-expire-notifier-mysql:3306/cert-expire-notifier"
  TZ: "UTC"
  ENGAGE_LAB_USERNAME: ""
  ENGAGE_LAB_API_KEY: ""
  ENGAGE_LAB_FROM_EMAIL: ""
  HEALTHCHECKS_PING_URL: ""
  CERT_CHECK_CRON: "0 * * * *"
  CERT_CHECK_PROXY_URLS: ""
  CERT_EXPIRY_THRESHOLD_DAYS: "30"
  EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: "1440"
  PASSWORD_RESET_TOKEN_TTL_MINUTES: "60"
