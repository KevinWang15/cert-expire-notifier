apiVersion: v1
kind: Service
metadata:
  name: cert-expire-notifier-mysql
  namespace: cert-expire-notifier
  labels:
    app.kubernetes.io/name: cert-expire-notifier-mysql
spec:
  selector:
    app.kubernetes.io/name: cert-expire-notifier-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cert-expire-notifier-mysql
  namespace: cert-expire-notifier
  labels:
    app.kubernetes.io/name: cert-expire-notifier-mysql
spec:
  serviceName: cert-expire-notifier-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-expire-notifier-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-expire-notifier-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: cert-expire-notifier-mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
